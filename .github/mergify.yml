queue_rules:
  - name: default
    merge_method: rebase
    queue_conditions:
      - check-success=All Eval
      - check-success=All Builds
    merge_conditions: []
    batch_size:
      min: 1
      max: 8
    batch_max_wait_time: "1 minute"

pull_request_rules:
  - name: Queue when labeled and all CI jobs pass
    conditions:
      - and:
          - label=dependencies
          - check-success=All Eval
          - check-success=All Builds
    actions:
      queue:
        name: default
