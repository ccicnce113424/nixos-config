queue_rules:
  - name: default
    merge_method: rebase
    queue_conditions:
      - check-success=All Eval
      - check-success=All Builds
    merge_conditions: []

pull_request_rules:
  - name: Queue when labeled and all CI jobs pass
    conditions:
      - and:
          - label=dependencies
          - check-success=All Eval
          - check-success=All Builds
    actions:
      queue:
        name: default
