name: Update nixpkgs PR Patches

on:
  workflow_dispatch:
    inputs:
      add:
        description: PR numbers or URLs to add (space or comma separated)
        required: false
        default: ""
        type: string
      remove:
        description: PR numbers or URLs to remove (space or comma separated)
        required: false
        default: ""
        type: string
      prune:
        description: Also drop patches already in the nixpkgs revision pinned in flake.lock
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: nixpkgs-prs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    name: Update PR patches
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # PAT so the push triggers CI (the default GITHUB_TOKEN does not).
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            accept-flake-config = true

      - name: Update patches
        env:
          ADD: ${{ inputs.add }}
          REMOVE: ${{ inputs.remove }}
          PRUNE: ${{ inputs.prune }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRUNE" = "true" ]; then
            flags+=(--prune)
          fi
          if [ -n "$REMOVE" ]; then
            read -r -a refs <<< "${REMOVE//,/ }"
            for r in "${refs[@]}"; do flags+=(--remove "$r"); done
          fi
          if [ -n "$ADD" ]; then
            read -r -a refs <<< "${ADD//,/ }"
            for r in "${refs[@]}"; do flags+=(--add "$r"); done
          fi
          nix run .#nixpkgs-prs -- refresh "${flags[@]}"

      - name: Stage patch changes
        id: stage
        run: |
          set -euo pipefail
          git add nixpkgs-prs.json patches/nixpkgs-pr
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Verify patches build
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Build the patched nixpkgs before pushing, so a patch that no longer
          # applies (or produces a broken tree) fails here instead of in the
          # post-push CI. The changes must be staged above: Nix ignores untracked
          # files in a flake source, so newly added *.patch would not be applied.
          nix build -L --no-link '.#patchedNixpkgs'

      - name: Commit and push
        if: steps.stage.outputs.changed == 'true'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != branch ]; then
            echo "Ref '$REF_NAME' is not a branch; refusing to push" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update nixpkgs PR patches"
          git show --stat --oneline HEAD
          git push origin "HEAD:refs/heads/$REF_NAME"
