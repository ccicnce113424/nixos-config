name: Update nixpkgs PR Patches

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      add:
        description: PR numbers or URLs to add (space or comma separated)
        required: false
        default: ""
        type: string
      remove:
        description: PR numbers or URLs to remove (space or comma separated)
        required: false
        default: ""
        type: string
      prune:
        description: Also drop patches already in the nixpkgs revision pinned in flake.lock
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: nixpkgs-prs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    name: Update PR patches
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # On pull_request, check out the PR head branch (not the refs/pull/N/merge
          # default) so the refresh commits can be pushed back to it; manual runs
          # keep the ref they were started from.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          # PAT so the push triggers CI (the default GITHUB_TOKEN does not).
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}

      - name: Detect nixpkgs pin change
        id: nixpkgs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
        run: |
          set -euo pipefail
          # Only PR runs are gated: a manual run is always intentional.
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Identical lookup to scripts/nixpkgs-prs.sh cmd_prune: resolve the node
          # via root.inputs (no hardcoded node name), prefer the recorded rev,
          # else parse it out of the versioned release URL.
          pin_of() {
            jq -r '.nodes[(.nodes.root.inputs.nixpkgs // "nixpkgs")].locked
              | .rev // ((.url // "") | capture("nixos-[^/]*\\.(?<rev>[0-9a-f]{12})/")? | .rev)
              // empty' "$1" 2>/dev/null || true
          }
          # The checkout above is the PR head branch, possibly on a fork, so the
          # base flake.lock is fetched from the base repository.
          base_url="https://github.com/$BASE_REPO.git"
          if [ -n "$TOKEN" ]; then
            base_url="https://x-access-token:$TOKEN@github.com/$BASE_REPO.git"
          fi
          git fetch --no-tags --depth=1 "$base_url" "refs/heads/$BASE_REF"
          base_lock=$(mktemp)
          git show FETCH_HEAD:flake.lock > "$base_lock"
          head_pin=$(pin_of flake.lock)
          base_pin=$(pin_of "$base_lock")
          rm -f "$base_lock"
          if [ -z "$head_pin" ] || [ -z "$base_pin" ]; then
            echo "Cannot resolve the nixpkgs pin (base='$base_pin' head='$head_pin')" >&2
            exit 1
          fi
          if [ "$head_pin" = "$base_pin" ]; then
            echo "nixpkgs pin unchanged ($head_pin); nothing to update"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "nixpkgs pin changed: $base_pin -> $head_pin"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.nixpkgs.outputs.changed != 'false'
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            accept-flake-config = true

      - name: Update patches
        if: steps.nixpkgs.outputs.changed != 'false'
        env:
          ADD: ${{ inputs.add }}
          REMOVE: ${{ inputs.remove }}
          PRUNE: ${{ inputs.prune }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # pull_request runs have no inputs; keep the manual default (prune on).
          prune="${PRUNE:-true}"
          flags=()
          if [ "$prune" = "true" ]; then
            flags+=(--prune)
          fi
          if [ -n "$REMOVE" ]; then
            read -r -a refs <<< "${REMOVE//,/ }"
            for r in "${refs[@]}"; do flags+=(--remove "$r"); done
          fi
          if [ -n "$ADD" ]; then
            read -r -a refs <<< "${ADD//,/ }"
            for r in "${refs[@]}"; do flags+=(--add "$r"); done
          fi
          nix run .#nixpkgs-prs -- refresh "${flags[@]}"

      - name: Stage patch changes
        id: stage
        run: |
          set -euo pipefail
          git add nixpkgs-prs.json patches/nixpkgs-pr
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Verify patches build
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Build the patched nixpkgs before pushing, so a patch that no longer
          # applies (or produces a broken tree) fails here instead of in the
          # post-push CI. The changes must be staged above: Nix ignores untracked
          # files in a flake source, so newly added *.patch would not be applied.
          nix build -L --no-link '.#patchedNixpkgs'

      - name: Commit and push
        if: steps.stage.outputs.changed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          # A manual run can be started from a tag, which cannot take a push.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF_TYPE" != branch ]; then
            echo "Ref type '$REF_TYPE' is not a branch; refusing to push" >&2
            exit 1
          fi
          if [ -z "$TARGET_BRANCH" ]; then
            echo "No target branch resolved; refusing to push" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update nixpkgs PR patches"
          git show --stat --oneline HEAD
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
